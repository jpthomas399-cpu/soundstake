<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoundStake — Artist Tracks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0c0b09; --ink2: #38352e; --ink3: #7a756c;
      --paper: #f7f4ee; --cream: #efe9dc;
      --gold: #b8821e; --gold-light: #f5e6c0; --gold-vivid: #d4941f;
      --rule: #d8d2c4; --white: #ffffff;
    }
    body { background: var(--paper); color: var(--ink); font-family: 'Syne', sans-serif; min-height: 100vh; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 52px; background: rgba(247,244,238,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule); }
    .nav-logo { font-family: 'Instrument Serif', serif; font-size: 1.3rem; color: var(--ink); text-decoration: none; }
    .nav-logo em { font-style: italic; color: var(--gold); }
    .nav-links { display: flex; gap: 36px; list-style: none; align-items: center; }
    .nav-links a { font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: var(--ink); }
    .nav-cta { font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white); background: var(--ink); border: none; padding: 10px 24px; cursor: pointer; text-decoration: none; transition: background 0.2s; display: inline-block; }
    .nav-cta:hover { background: var(--gold); }
    .nav-signout { font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); text-decoration: none; margin-left: 16px; cursor: pointer; }
    .nav-signout:hover { color: var(--ink); }

    /* PAGE */
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 120px 52px 100px; }

    /* ARTIST HEADER */
    .artist-header {
      display: flex; align-items: flex-start; gap: 32px;
      padding-bottom: 40px; margin-bottom: 48px;
      border-bottom: 1px solid var(--rule);
    }
    .artist-photo {
      width: 100px; height: 100px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; overflow: hidden;
    }
    .artist-photo.g0 { background: linear-gradient(135deg, #1a0a2e, #0d1f3c); }
    .artist-photo.g1 { background: linear-gradient(135deg, #1a0a0a, #2d1a00); }
    .artist-photo.g2 { background: linear-gradient(135deg, #001a1a, #1a002d); }
    .artist-photo.g3 { background: linear-gradient(135deg, #0a1a0a, #1a1a00); }
    .artist-photo.g4 { background: linear-gradient(135deg, #1a1a00, #002d1a); }
    .artist-photo.g5 { background: linear-gradient(135deg, #0d0d1a, #1a0d0d); }
    .artist-photo img { width: 100%; height: 100%; object-fit: cover; }
    .artist-info { flex: 1; }
    .artist-eyebrow { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    .artist-name { font-family: 'Instrument Serif', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); font-style: italic; color: var(--ink); line-height: 1.1; margin-bottom: 6px; }
    .artist-genre { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--ink3); margin-bottom: 10px; }
    .artist-bio { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--ink2); line-height: 1.7; max-width: 520px; margin-bottom: 14px; }
    .artist-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .artist-tag { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 10px; background: var(--cream); color: var(--ink3); border: 1px solid var(--rule); }
    .artist-tag.primary { background: var(--gold-light); color: var(--gold); border-color: var(--gold); }

    /* TRACKS HEADER */
    .tracks-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .tracks-title { font-family: 'Instrument Serif', serif; font-size: 1.6rem; letter-spacing: -0.02em; color: var(--ink); }
    .tracks-title em { font-style: italic; color: var(--gold); }
    .tracks-count-badge { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--ink3); letter-spacing: 0.1em; }

    /* TRACK CARD */
    .track-card {
      border: 1px solid var(--rule);
      margin-bottom: 20px;
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .track-card:hover { border-color: var(--gold); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

    .track-card-top {
      padding: 20px 24px 16px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    }
    .track-num { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--ink3); margin-right: 8px; }
    .track-title { font-family: 'Instrument Serif', serif; font-size: 1.2rem; font-style: italic; color: var(--ink); margin-bottom: 5px; }
    .track-meta { font-family: 'DM Mono', monospace; font-size: 0.66rem; color: var(--ink3); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
    .track-meta span { display: flex; align-items: center; gap: 3px; }
    .track-notes-label { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 5px; }
    .track-notes { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--ink2); line-height: 1.65; max-width: 560px; }
    .track-badge { font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; flex-shrink: 0; align-self: flex-start; }
    .track-badge.open { background: var(--gold-light); color: var(--gold); border: 1px solid var(--gold); }
    .track-badge.draft { background: var(--cream); color: var(--ink3); border: 1px solid var(--rule); }

    /* PLAYER */
    .track-player {
      padding: 14px 24px 16px;
      border-top: 1px solid var(--rule);
      background: var(--ink);
      display: flex; align-items: center; gap: 16px;
    }
    .play-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--gold); border: none; cursor: pointer;
      font-size: 0.9rem; color: white; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; line-height: 1;
    }
    .play-btn:hover { background: var(--gold-vivid); }
    .player-info { flex: 1; min-width: 0; }
    .player-filename { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: #c0b8a8; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-wrap { height: 4px; background: #2a2724; cursor: pointer; position: relative; border-radius: 2px; }
    .progress-fill { height: 100%; background: var(--gold); width: 0%; pointer-events: none; border-radius: 2px; transition: width 0.1s linear; }
    .player-time { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: #6a6460; flex-shrink: 0; min-width: 80px; text-align: right; }

    .track-no-audio {
      padding: 14px 24px;
      border-top: 1px solid var(--rule);
      font-family: 'DM Mono', monospace; font-size: 0.72rem;
      color: var(--ink3); font-style: italic;
      background: var(--cream);
    }

    /* EMPTY / ERROR STATES */
    .state-box { text-align: center; padding: 80px 40px; border: 1px dashed var(--rule); }
    .state-icon { font-size: 3rem; margin-bottom: 20px; }
    .state-title { font-family: 'Instrument Serif', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 12px; }
    .state-title em { font-style: italic; color: var(--gold); }
    .state-body { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--ink3); line-height: 1.7; max-width: 380px; margin: 0 auto 28px; }
    .btn-primary { font-family: 'DM Mono', monospace; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white); background: var(--ink); border: none; padding: 12px 28px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; }
    .btn-primary:hover { background: var(--gold); }

    /* STAKE CALLOUT */
    .stake-callout {
      margin-top: 48px; padding: 28px 32px;
      background: var(--ink); border: 1px solid #2a2724;
      display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    }
    .stake-callout-text {}
    .stake-callout-label { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
    .stake-callout-title { font-family: 'Instrument Serif', serif; font-size: 1.4rem; color: #f0ece4; font-style: italic; margin-bottom: 4px; }
    .stake-callout-sub { font-family: 'DM Mono', monospace; font-size: 0.74rem; color: #6a6460; line-height: 1.6; }
    .btn-gold { font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); background: var(--gold); border: none; padding: 12px 28px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; flex-shrink: 0; }
    .btn-gold:hover { background: var(--gold-vivid); }

    /* FOOTER */
    footer { background: #080706; padding: 36px 52px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; border-top: 1px solid #1e1c18; margin-top: 80px; }
    .footer-logo { font-family: 'Instrument Serif', serif; font-size: 1rem; color: #4a4540; text-decoration: none; }
    .footer-logo em { font-style: italic; color: var(--gold); }
    .footer-copy { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: #3a3530; }

    @media (max-width: 700px) {
      nav { padding: 18px 20px; }
      .page-wrap { padding: 100px 20px 80px; }
      .artist-header { flex-direction: column; gap: 20px; }
      footer { padding: 28px 20px; flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Sound<em>Stake</em></a>
    <ul class="nav-links">
      <li><a href="how-it-works.html">How It Works</a></li>
      <li><a href="artists.html">Artists</a></li>
    </ul>
    <a href="signup.html" class="nav-cta" id="nav-cta">Get Started</a>
  </nav>

  <div class="page-wrap">
    <div id="page-content">
      <!-- Populated by JS -->
    </div>
  </div>

  <footer>
    <a href="index.html" class="footer-logo">Sound<em>Stake</em></a>
    <p class="footer-copy">© 2026 SoundStake · Built on Base · IPFS · ERC-20 / ERC-721</p>
  </footer>

  <script>
    /* ─── Helpers ─── */
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function formatTime(secs) {
      if (!secs || isNaN(secs)) return '0:00';
      var m = Math.floor(secs / 60), s = Math.floor(secs % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    /* ─── Load artist + tracks from localStorage ─── */
    function getArtistAndTracks() {
      var params = new URLSearchParams(window.location.search);
      var userId = params.get('user');
      if (!userId) return null;

      // Find artist in ss_users
      var users = [];
      try { users = JSON.parse(localStorage.getItem('ss_users') || '[]'); } catch(e) {}

      var artist = null;
      for (var i = 0; i < users.length; i++) {
        var u = users[i];
        if (String(u.id) === userId || u.username === userId) { artist = u; break; }
      }

      // Also check demo artists if not found (so demo "View Tracks" shows something graceful)
      if (!artist) return null;

      // Load their tracks
      var tracks = [];
      try { tracks = JSON.parse(localStorage.getItem('ss_tracks_' + artist.id) || '[]'); } catch(e) {}

      return { artist: artist, tracks: tracks };
    }

    /* ─── Render ─── */
    function render() {
      var data = getArtistAndTracks();
      var content = document.getElementById('page-content');

      if (!data) {
        content.innerHTML =
          '<div class="state-box">' +
            '<div class="state-icon">🎵</div>' +
            '<h2 class="state-title">Artist <em>not found</em></h2>' +
            '<p class="state-body">This artist profile doesn\'t exist or hasn\'t been set up yet.</p>' +
            '<a href="artists.html" class="btn-primary">← Back to Artists</a>' +
          '</div>';
        return;
      }

      var artist = data.artist;
      var tracks = data.tracks;
      var p = artist.artistProfile || {};

      // Set page title
      document.title = 'SoundStake — ' + (p.artistName || artist.username) + ' Tracks';

      // Artist header
      var photoHtml = p.photo
        ? '<img src="' + esc(p.photo) + '" alt="' + esc(p.artistName) + '">'
        : '🎵';
      var gradClass = 'g' + (Math.abs(hashCode(artist.username || '')) % 6);

      var allTags = [];
      if (p.genre) allTags.push({ label: p.genre, primary: true });
      (p.tags || []).forEach(function(t) { if (t !== p.genre) allTags.push({ label: t, primary: false }); });
      var tagsHtml = allTags.map(function(t) {
        return '<span class="artist-tag' + (t.primary ? ' primary' : '') + '">' + esc(t.label) + '</span>';
      }).join('');

      var headerHtml =
        '<div class="artist-header">' +
          '<div class="artist-photo ' + gradClass + '">' + photoHtml + '</div>' +
          '<div class="artist-info">' +
            '<p class="artist-eyebrow">Artist Profile</p>' +
            '<h1 class="artist-name">' + esc(p.artistName || artist.username) + '</h1>' +
            '<p class="artist-genre">' + esc(p.genre || '') + (p.location ? ' · 📍 ' + esc(p.location) : '') + '</p>' +
            (p.bio ? '<p class="artist-bio">' + esc(p.bio) + '</p>' : '') +
            (tagsHtml ? '<div class="artist-tags">' + tagsHtml + '</div>' : '') +
          '</div>' +
        '</div>';

      // Tracks
      var tracksHtml = '';
      if (!tracks.length) {
        tracksHtml =
          '<div class="state-box">' +
            '<div class="state-icon">🎧</div>' +
            '<h2 class="state-title">No tracks <em>yet</em></h2>' +
            '<p class="state-body">This artist hasn\'t uploaded any tracks for critique yet. Check back soon.</p>' +
          '</div>';
      } else {
        var openTracks = tracks.filter(function(t) { return t.openForCritique; });
        var draftTracks = tracks.filter(function(t) { return !t.openForCritique; });
        // Show open tracks first, then drafts
        var ordered = openTracks.concat(draftTracks);

        tracksHtml =
          '<div class="tracks-hd">' +
            '<h2 class="tracks-title">Uploaded <em>tracks</em></h2>' +
            '<span class="tracks-count-badge">' + tracks.length + ' track' + (tracks.length !== 1 ? 's' : '') + '</span>' +
          '</div>';

        tracksHtml += ordered.map(function(t, i) {
          var hasAudio = !!t.audioData;
          var metaItems = [];
          if (t.genre) metaItems.push(esc(t.genre));
          if (t.version) metaItems.push(esc(t.version));
          if (t.bpm) metaItems.push('BPM: ' + esc(t.bpm));
          if (t.key) metaItems.push('Key: ' + esc(t.key));
          metaItems.push('Stake: $' + esc(String(t.stake)));
          metaItems.push(new Date(t.uploaded).toLocaleDateString());

          var playerHtml = hasAudio
            ? '<div class="track-player">' +
                '<button class="play-btn" id="playbtn-' + t.id + '" onclick="playTrack(' + t.id + ')">▶</button>' +
                '<div class="player-info">' +
                  '<div class="player-filename">' + esc(t.filename || t.title) + '</div>' +
                  '<div class="progress-wrap" id="prog-wrap-' + t.id + '" onclick="seekTrack(event,' + t.id + ')">' +
                    '<div class="progress-fill" id="prog-fill-' + t.id + '"></div>' +
                  '</div>' +
                '</div>' +
                '<div class="player-time" id="prog-time-' + t.id + '">0:00 / 0:00</div>' +
                '<audio id="audio-' + t.id + '" src="' + esc(t.audioData) + '" preload="none"></audio>' +
              '</div>'
            : '<div class="track-no-audio">Audio preview not available for this track.</div>';

          return '<div class="track-card">' +
            '<div class="track-card-top">' +
              '<div>' +
                '<div class="track-title"><span class="track-num">' + (i+1) + '.</span> ' + esc(t.title) + '</div>' +
                '<div class="track-meta">' + metaItems.map(function(m){ return '<span>' + m + '</span>'; }).join('') + '</div>' +
                (t.publicNotes && t.notes
                  ? '<div class="track-notes-label">Notes for critics</div><div class="track-notes">' + esc(t.notes) + '</div>'
                  : '') +
              '</div>' +
              '<span class="track-badge ' + (t.openForCritique ? 'open' : 'draft') + '">' + (t.openForCritique ? 'Open' : 'Draft') + '</span>' +
            '</div>' +
            playerHtml +
          '</div>';
        }).join('');
      }

      // Stake CTA (only show if there are open tracks)
      var hasOpenTracks = tracks.some(function(t) { return t.openForCritique; });
      var stakeCta = hasOpenTracks
        ? '<div class="stake-callout">' +
            '<div class="stake-callout-text">' +
              '<div class="stake-callout-label">Leave Staked Critique</div>' +
              '<div class="stake-callout-title">Got something to say?</div>' +
              '<div class="stake-callout-sub">Stake SOUND tokens to leave feedback. If the community votes your critique useful, you earn rewards.</div>' +
            '</div>' +
            '<a href="signup.html" class="btn-gold">Create Account to Critique →</a>' +
          '</div>'
        : '';

      content.innerHTML = headerHtml +
        '<div id="tracks-container">' + tracksHtml + '</div>' +
        stakeCta;
    }

    /* ─── Audio playback ─── */
    var activeId = null;

    function playTrack(id) {
      var audio = document.getElementById('audio-' + id);
      var btn   = document.getElementById('playbtn-' + id);
      if (!audio || !btn) return;

      // Stop any currently playing track
      if (activeId && activeId !== id) {
        var prevAudio = document.getElementById('audio-' + activeId);
        var prevBtn   = document.getElementById('playbtn-' + activeId);
        if (prevAudio) prevAudio.pause();
        if (prevBtn) prevBtn.textContent = '▶';
      }

      if (audio.paused) {
        audio.play();
        btn.textContent = '⏸';
        activeId = id;
        audio.ontimeupdate = function() {
          var pct  = audio.duration ? (audio.currentTime / audio.duration * 100) : 0;
          var fill = document.getElementById('prog-fill-' + id);
          var time = document.getElementById('prog-time-' + id);
          if (fill) fill.style.width = pct + '%';
          if (time) time.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
        };
        audio.onended = function() {
          btn.textContent = '▶';
          var fill = document.getElementById('prog-fill-' + id);
          if (fill) fill.style.width = '0%';
          activeId = null;
        };
      } else {
        audio.pause();
        btn.textContent = '▶';
        activeId = null;
      }
    }

    function seekTrack(e, id) {
      var audio = document.getElementById('audio-' + id);
      var wrap  = document.getElementById('prog-wrap-' + id);
      if (!audio || !wrap || !audio.duration) return;
      var pct = (e.clientX - wrap.getBoundingClientRect().left) / wrap.offsetWidth;
      audio.currentTime = Math.max(0, Math.min(1, pct)) * audio.duration;
    }

    /* ─── Simple hash for consistent gradient per artist ─── */
    function hashCode(str) {
      var h = 0;
      for (var i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      return h;
    }

    /* ─── Session-aware nav ─── */
    (function() {
      var sess = null;
      try { sess = JSON.parse(localStorage.getItem('ss_session') || 'null'); } catch(e) {}
      var cta = document.getElementById('nav-cta');
      if (!cta || !sess || !sess.username) return;
      var href  = sess.role === 'artist' ? 'artist-profile.html' : 'artists.html';
      var label = sess.role === 'artist' ? 'My Profile' : 'Browse Artists';
      cta.textContent = label;
      cta.href = href;
      var so = document.createElement('a');
      so.className = 'nav-signout';
      so.textContent = 'Sign Out';
      so.href = '#';
      so.onclick = function() { localStorage.removeItem('ss_session'); location.reload(); return false; };
      cta.parentNode.insertBefore(so, cta.nextSibling);
    })();

    /* ─── Init ─── */
    render();
  </script>
</body>
</html>
